spring:
  datasource:
    url: jdbc:h2:mem:urlshortener-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  base-url: http://localhost:8080
  owner-id-header: X-Owner-Id
  rate-limit:
    capacity: 20
    refill-per-minute: 20
  redirect-cache:
    max-size: 10000
    ttl-minutes: 5
  cleanup:
    expired-retention-days: 30

logging:
  level:
    com.urlshortener: INFO
